{% extends "base.html" %}

{% block title %}
Delete Class | School SMS
{% endblock %}

{% block content %}

<div class="row justify-content-center pt-5">

    <div class="col-md-6">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4 text-center">

                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>

                <h4 class="mt-3">
                    Delete Class?
                </h4>

                <p class="text-muted">
                    You are about to delete
                    <strong>
                        {{ academic_class.name }}
                    </strong>.
                </p>

                <form method="post">

                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">

                        <a
                            href="{% url 'academics:class_detail' academic_class.pk %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Delete
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
