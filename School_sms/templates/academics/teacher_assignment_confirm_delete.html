{% extends "base.html" %}

{% block title %}
Remove Teacher Assignment | School SMS
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4 text-center">

                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>

                <h4 class="mt-3">
                    Remove Assignment?
                </h4>

                <p class="text-muted">

                    Remove

                    <strong>
                        {{ assignment.teacher.get_full_name }}
                    </strong>

                    from

                    <strong>
                        {{ assignment.subject.name }}
                    </strong>

                    for

                    <strong>
                        {{ assignment.class_arm }}
                    </strong>?

                </p>

                <form method="post">

                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">

                        <a
                            href="{% url 'academics:teacher_assignment_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Remove Assignment
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
