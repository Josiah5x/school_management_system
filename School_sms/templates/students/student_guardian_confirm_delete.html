{% extends "base.html" %}

{% block title %}
Remove Guardian | School SMS
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card border-0 shadow-sm">

            <div class="card-body text-center p-5">

                <i class="bi bi-link-45deg text-warning fs-1"></i>

                <h4 class="mt-3">
                    Remove Guardian?
                </h4>

                <p class="text-muted">

                    Remove

                    <strong>
                        {{ relationship.guardian.full_name }}
                    </strong>

                    from

                    <strong>
                        {{ relationship.student.full_name }}
                    </strong>?

                </p>

                <form method="post">

                    {% csrf_token %}

                    <a
                        href="{% url 'students:student_detail' relationship.student.pk %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Remove Guardian
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
